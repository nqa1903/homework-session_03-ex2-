<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Không tìm thấy trang</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --ink: #1d2433;
      --muted: #5d6679;
      --accent: #2a5bd7;
      --accent-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --ink: #e8ebf2;
        --muted: #9aa3b5;
        --accent: #6f95f5;
        --accent-ink: #0f1420;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 520px; }
    .code {
      margin: 0;
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--accent);
    }
    h1 { margin: 16px 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 24px; color: var(--muted); }
    a.btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      text-decoration: none;
    }
    a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Không tìm thấy trang bạn cần</h1>
    <p>Đường dẫn này không tồn tại hoặc đã bị di chuyển. Hãy kiểm tra lại địa chỉ đã nhập, hoặc quay về trang chủ để tiếp tục.</p>
    <a class="btn" href="/">Về trang chủ</a>
  </main>
</body>
</html>
